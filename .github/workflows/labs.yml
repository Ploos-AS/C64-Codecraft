name: Labs

on:
  push:
    paths:
      - "labs/**"
      - "tools/check_labs.py"
      - "tools/run_cpu_labs.py"
      - "tools/cpu6502_harness.py"
      - "tools/test_cpu6502_harness.py"
      - "tools/vice_machine_runner.py"
      - "tools/test_vice_machine_runner.py"
      - ".github/workflows/labs.yml"
  pull_request:
    paths:
      - "labs/**"
      - "tools/check_labs.py"
      - "tools/run_cpu_labs.py"
      - "tools/cpu6502_harness.py"
      - "tools/test_cpu6502_harness.py"
      - "tools/vice_machine_runner.py"
      - "tools/test_vice_machine_runner.py"
      - ".github/workflows/labs.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
    steps:
      - name: Install lab toolchain
        run: |
          sed -i 's/Components: main/Components: main contrib/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl make 64tass vice python3 xvfb xauth
      - uses: actions/checkout@v4
      - name: Check Python
        run: python3 --version
      - name: Validate lab metadata/layout
        run: python3 tools/check_labs.py
      - name: Assemble all labs
        run: |
          set -eu
          for makefile in labs/*/*/Makefile; do
            dir="$(dirname "$makefile")"
            echo "==> $dir"
            make -C "$dir" clean all
          done
      - name: Test CPU/RAM harness
        run: python3 tools/test_cpu6502_harness.py
      - name: Test VICE machine-runner contract
        run: python3 tools/test_vice_machine_runner.py
      - name: Run deterministic CPU/RAM qualification
        run: python3 tools/run_cpu_labs.py
      - name: Fetch redistributable Open ROMs for VICE
        run: |
          mkdir -p build/open-roms
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/kernal_generic.rom -o build/open-roms/kernal.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/basic_generic.rom -o build/open-roms/basic.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/chargen_openroms.rom -o build/open-roms/chargen.rom
          test "$(wc -c < build/open-roms/kernal.rom)" -eq 8192
          test "$(wc -c < build/open-roms/basic.rom)" -eq 8192
          test "$(wc -c < build/open-roms/chargen.rom)" -eq 4096
      - name: Run Lab 00.03 VICE machine-state qualification
        run: |
          make -C labs/00-intro/03-subroutine-stack clean all
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from vice_machine_runner import ViceBinaryMonitorBackend, qualify

          prg = Path("labs/00-intro/03-subroutine-stack/build/subroutine-stack.prg")
          payload = prg.read_bytes()
          print(f"Lab 00.03 PRG bytes: {payload.hex()}")
          print("Lab 00.03 expected code @0810: 20140860a9058d20d0201d0860a9008d21d060")
          result = qualify(
              prg,
              expected_memory={0xD020: 0x05, 0xD021: 0x00},
              backend=ViceBinaryMonitorBackend(rom_dir=Path("build/open-roms")),
          )
          observed = result["observation"].memory
          print(f"Lab 00.03 VICE state: D020={observed[0xD020]:02x} D021={observed[0xD021]:02x}")
          PY
