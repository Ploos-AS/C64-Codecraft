name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing dependency
        run: python3 -m pip install --disable-pip-version-check 'Markdown==3.9'\n      - name: Validate sources\n        run: python3 tools/publish.py check
      - name: Build site
        run: python3 tools/publish.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
