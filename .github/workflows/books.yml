name: Books

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex calibre epubcheck librsvg2-bin poppler-utils
      - name: Validate sources
        run: python3 tools/publish.py check
      - name: Require production covers
        run: |
          test -s book/cover-no.svg
          test -s book/cover-en.svg
      - name: Build EPUB Kindle and PDF
        run: python3 tools/publish.py book
      - name: Verify artifacts
        run: |
          test -s build/books/C64-Codecraft-NO.epub
          test -s build/books/C64-Codecraft-NO.azw3
          test -s build/books/C64-Codecraft-NO.pdf
          test -s build/books/C64-Codecraft-EN.epub
          test -s build/books/C64-Codecraft-EN.azw3
          test -s build/books/C64-Codecraft-EN.pdf
      - name: Validate embedded covers
        run: |
          unzip -l build/books/C64-Codecraft-NO.epub | grep -Ei 'cover.*\.(png|jpg|jpeg)'
          unzip -l build/books/C64-Codecraft-EN.epub | grep -Ei 'cover.*\.(png|jpg|jpeg)'
          ebook-meta build/books/C64-Codecraft-NO.azw3 | grep -i 'cover'
          ebook-meta build/books/C64-Codecraft-EN.azw3 | grep -i 'cover'
          pdfinfo build/books/C64-Codecraft-NO.pdf | grep -E '^Pages:[[:space:]]+[1-9]'
          pdfinfo build/books/C64-Codecraft-EN.pdf | grep -E '^Pages:[[:space:]]+[1-9]'
      - name: Validate localized ebook metadata
        run: |
          ebook-meta build/books/C64-Codecraft-NO.epub | grep -F "C64 Codecraft"
          ebook-meta build/books/C64-Codecraft-EN.epub | grep -F "C64 Codecraft"
          ebook-meta build/books/C64-Codecraft-NO.azw3 | grep -F "C64 Codecraft"
          ebook-meta build/books/C64-Codecraft-EN.azw3 | grep -F "C64 Codecraft"
      - name: Validate EPUB packages
        run: |
          epubcheck build/books/C64-Codecraft-NO.epub
          epubcheck build/books/C64-Codecraft-EN.epub
      - name: Validate PDF structure
        run: |
          pdfinfo build/books/C64-Codecraft-NO.pdf >/dev/null
          pdfinfo build/books/C64-Codecraft-EN.pdf >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: c64-codecraft-books
          path: build/books/
