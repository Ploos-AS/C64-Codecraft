name: OCI qualification

on:
  push:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"
  pull_request:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"

jobs:
  debian-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian reference toolbox
        run: docker build -f container/Dockerfile -t c64-codecraft:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft:m0
      - name: Assemble first course program with native 64tass
        run: |
          docker run --rm -v "$PWD:/work" c64-codecraft:m0 \
            sh -lc 'make example && test -s build/hello.prg'
      - name: Probe packaged VICE monitor capabilities
        run: |
          set -eu
          mkdir -p build
          sudo chown -R "$(id -u):$(id -g)" build
          docker run --rm c64-codecraft:m0 sh -lc '
            set +e
            x64sc -version > /tmp/version.txt 2>&1
            x64sc -help > /tmp/help.txt 2>&1
            cat /tmp/version.txt
            printf '%s\n' '--- monitor CLI probe ---'
            grep -Ei "monitor|remote|binary|console|headless|limitcycles|autostart|initbreak" /tmp/help.txt || true
            printf '%s\n' '--- monitor resource probe ---'
            x64sc -default -dumpconfig 2>&1 | grep -Ei "Monitor(Server|ServerAddress)|BinaryMonitor(Server|ServerAddress)|NativeMonitor" || true
            printf '%s\n' '--- direct binary-monitor startup probe ---'
            timeout 2s x64sc -binarymonitor -binarymonitoraddress ip4://127.0.0.1:6502 -console 2>&1 || rc=$?
            rc=${rc:-0}
            printf 'binary-monitor probe exit=%s\\n' "$rc"
            test "$rc" -eq 124
          ' | tee build/vice-capabilities.txt
          test -s build/vice-capabilities.txt
      - name: Prove VICE binary-monitor TCP socket
        run: |
          docker run --rm c64-codecraft:m0 sh -lc '
            set -eu
            timeout 8s x64sc -binarymonitor -binarymonitoraddress ip4://127.0.0.1:6502 -console >/tmp/vice.log 2>&1 &
            vice_pid=$!
            trap "kill $vice_pid 2>/dev/null || true" EXIT
            set +e
            python3 - <<"PY"
          import socket
          import time

          deadline = time.monotonic() + 5
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 6502), timeout=0.5):
                      print("VICE binary monitor TCP socket accepted a connection")
                      break
              except OSError as exc:
                  last_error = exc
                  time.sleep(0.1)
          else:
              print(f"binary monitor socket unavailable: {last_error}")
              raise SystemExit(1)
          PY
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            printf "%s\\n" "--- VICE startup log ---"
            cat /tmp/vice.log || true
            printf "%s\\n" "--- VICE process ---"
            if kill -0 "$vice_pid" 2>/dev/null; then
              echo "VICE process is still alive"
              ps -p "$vice_pid" -o pid=,stat=,args= || true
            else
              echo "VICE process exited before socket became available"
              wait "$vice_pid" || echo "VICE exit=$?"
            fi
            printf "%s\\n" "--- listening sockets ---"
            (command -v ss >/dev/null && ss -ltnp) || true
            exit "$rc"
          fi
          '

      - name: Upload VICE capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: vice-capabilities
          path: build/vice-capabilities.txt
      - name: Fetch redistributable Open ROMs for VICE
        run: |
          sudo mkdir -p build/open-roms
          sudo chown -R "$(id -u):$(id -g)" build
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/kernal_generic.rom -o build/open-roms/kernal.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/basic_generic.rom -o build/open-roms/basic.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/chargen_openroms.rom -o build/open-roms/chargen.rom
          test "$(wc -c < build/open-roms/kernal.rom)" -eq 8192
          test "$(wc -c < build/open-roms/basic.rom)" -eq 8192
          test "$(wc -c < build/open-roms/chargen.rom)" -eq 4096
      - name: Verify canonical PRG payload
        run: |
          test "$(tail -c 11 build/hello.prg | od -An -tx1 | tr -d " \\n")" = "a9068d20d0a90e8d21d060"

  debian-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extended scene toolbox
        run: docker build -f container/Dockerfile.full -t c64-codecraft-full:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft-full:m0
