name: OCI qualification

on:
  push:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"
  pull_request:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"

jobs:
  debian-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian reference toolbox
        run: docker build -f container/Dockerfile -t c64-codecraft:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft:m0
      - name: Assemble first course program with native 64tass
        run: |
          docker run --rm -v "$PWD:/work" c64-codecraft:m0 \
            sh -lc 'make example && test -s build/hello.prg'
      - name: Probe packaged VICE monitor capabilities
        run: |
          set -eu
          mkdir -p build\n          sudo chown -R "$(id -u):$(id -g)" build\n          docker run --rm c64-codecraft:m0 sh -lc '
            set +e
            x64sc -version > /tmp/version.txt 2>&1
            x64sc -help > /tmp/help.txt 2>&1
            cat /tmp/version.txt
            grep -Ei "monitor|remote|binary|console|headless|limitcycles|autostart" /tmp/help.txt || true
          ' | tee build/vice-capabilities.txt
          test -s build/vice-capabilities.txt
      - name: Upload VICE capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: vice-capabilities
          path: build/vice-capabilities.txt
      - name: Fetch redistributable Open ROMs for VICE
        run: |
          sudo mkdir -p build/open-roms
          sudo chown -R "$(id -u):$(id -g)" build
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/kernal_generic.rom -o build/open-roms/kernal.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/basic_generic.rom -o build/open-roms/basic.rom
          curl -fsSL https://raw.githubusercontent.com/MEGA65/open-roms/master/bin/chargen_openroms.rom -o build/open-roms/chargen.rom
          test "$(wc -c < build/open-roms/kernal.rom)" -eq 8192
          test "$(wc -c < build/open-roms/basic.rom)" -eq 8192
          test "$(wc -c < build/open-roms/chargen.rom)" -eq 4096
      - name: Verify canonical PRG payload
        run: |
          test "$(tail -c 11 build/hello.prg | od -An -tx1 | tr -d " \n")" = "a9068d20d0a90e8d21d060"

  debian-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extended scene toolbox
        run: docker build -f container/Dockerfile.full -t c64-codecraft-full:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft-full:m0
