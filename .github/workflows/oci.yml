name: OCI qualification

on:
  push:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"
  pull_request:
    paths:
      - "container/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/oci.yml"

jobs:
  debian-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian reference toolbox
        run: docker build -f container/Dockerfile -t c64-codecraft:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft:m0
      - name: Assemble first course program with native 64tass
        run: |
          docker run --rm -v "$PWD:/work" c64-codecraft:m0             sh -lc 'make example && test -s build/hello.prg'

  debian-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extended scene toolbox
        run: docker build -f container/Dockerfile.full -t c64-codecraft-full:m0 .
      - name: Toolchain diagnostics
        run: docker run --rm c64-codecraft-full:m0
